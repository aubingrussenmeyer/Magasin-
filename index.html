<style>
:root{--bg:#f7f3ee;--card:#fff;--ink:#2a1b14;--mute:#7b6a60;--wood:#8a5a46;--wood2:#5a3a2c;--rose:#d9531e;--rose2:#fbe6d6;--line:#e6dcd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

button{font:inherit;cursor:pointer;color:inherit}

.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* hero : la vitrine */
.hero{padding:34px 0 10px}
.window{border:14px solid var(--wood);border-radius:6px;background:linear-gradient(180deg,var(--rose2),var(--bg) 70%);box-shadow:inset 0 0 0 3px var(--wood2),0 18px 40px -22px #0006;padding:38px 26px 0;text-align:center;position:relative;overflow:hidden}
.window h1{font-size:clamp(30px,6vw,56px);font-style:italic}.logo{width:min(230px,62%);display:block;margin:0 auto 14px;background:#fff;border-radius:18px;padding:4px}.about{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;margin-top:60px}.about img{width:100%;border-radius:14px;border:8px solid var(--wood);display:block}.about h2{font-size:34px;margin-bottom:12px}@media(max-width:640px){.about{grid-template-columns:1fr}}
.window p{max-width:46ch;margin:14px auto 22px;color:var(--mute)}
.shelf{height:22px;margin:26px -26px 0;background:linear-gradient(var(--wood),var(--wood2))}
.cta{display:inline-flex;gap:8px;align-items:center;background:var(--rose);color:#fff;border:0;border-radius:99px;padding:11px 22px;font-weight:600;text-decoration:none}

.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line);margin-top:28px}
.bar .in{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1 1 100%;padding-bottom:2px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 15px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.bar input[type=search]{flex:1 1 200px}
/* grille */
h2.sec{font-size:30px;margin:30px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;text-align:left;padding:0;display:block;width:100%}
.ph{aspect-ratio:4/5;background:var(--rose2);display:grid;place-items:center;font-size:56px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img{transform:scale(1.04)}
.meta{padding:12px 14px 14px}.meta b{font-weight:600;display:block}.meta span{color:var(--mute);font-size:14px}
.price{font-family:"Bodoni Moda",Georgia,serif;font-size:19px;color:var(--ink)}.old{text-decoration:line-through;color:var(--mute);font-size:14px;margin-left:6px}
.tag{position:absolute;left:10px;top:10px;background:var(--rose);color:#fff;border-radius:99px;font-size:12px;font-weight:600;padding:3px 10px}
.tag.s{background:var(--ink);color:var(--bg)}
.heart{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:#fffc;color:#2a1b14;font-size:18px;display:grid;place-items:center}
.heart[aria-pressed=true]{color:var(--rose)}
.sold{opacity:.55}
.empty{padding:50px 0;text-align:center;color:var(--mute)}

dialog{border:0;border-radius:18px;padding:0;max-width:880px;width:calc(100% - 28px);background:var(--card);color:var(--ink);max-height:92vh;overflow:auto}
dialog::backdrop{background:#000a}
.fiche{display:grid;grid-template-columns:1fr 1fr}
.fiche .ph{aspect-ratio:auto;min-height:340px;height:100%}
.fiche .txt{padding:28px}.fiche h2{font-size:32px;margin-bottom:6px}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}.sizes i{font-style:normal;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:14px}
.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:#fffd;color:#2a1b14;font-size:20px;z-index:2}
@media(max-width:640px){.fiche{grid-template-columns:1fr}.fiche .ph{min-height:300px}.window{border-width:9px;padding:28px 16px 0}.shelf{margin:22px -16px 0}}
/* admin */
.admin{background:var(--card);border:1px dashed var(--rose);border-radius:14px;padding:20px;margin:24px 0}
.admin form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.admin .full{grid-column:1/-1}
.admin label{font-size:13px;color:var(--mute);display:grid;gap:4px}
.mini{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0}.mini img,.mini u{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--rose2);flex:none}.mini div{flex:1;min-width:0}
.mini button{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:13px}
footer{margin-top:70px;background:var(--wood2);color:#f4ebe3;padding:40px 0 46px}
footer h3{font-size:26px;margin-bottom:10px}footer a{color:#f4ebe3}footer .cols{display:flex;gap:40px;flex-wrap:wrap}footer p{margin:4px 0;color:#e7d9cd}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:20}

.ph{position:relative}.cnt{position:absolute;right:8px;bottom:8px;background:#000a;color:#fff;border-radius:99px;font-size:12px;padding:2px 9px}
.gb{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:#fffd;color:#2a1b14;font-size:24px;line-height:1}.gb.l{left:10px}.gb.r{right:10px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;gap:8px;justify-content:center}.dot{width:11px;height:11px;border-radius:50%;border:0;padding:0;background:#fffa}.dot[aria-current=true]{background:var(--rose);transform:scale(1.25)}
.mini{flex-wrap:wrap}.thumbs{display:flex;gap:4px;flex-wrap:wrap;max-width:100%}.thumbs button{padding:0;border:0;background:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.lnk{background:none;border:0;color:#f4ebe3;text-decoration:underline;padding:0;margin-top:14px}.err{color:var(--rose);font-size:14px;min-height:1.2em}.admin .bar2{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}.note{background:var(--rose2);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:18px}
.topbar{border-bottom:1px solid var(--line);background:var(--card)}.topbar .in{display:flex;justify-content:space-between;align-items:center;padding:12px 20px}.back{color:var(--ink);font-weight:600;text-decoration:none}.mini-logo{height:44px;background:#fff;border-radius:10px}.adm-h{font-size:40px;margin:28px 0 8px}.lead{color:var(--mute);margin:0 0 16px}
.pro{background:var(--ink);color:var(--bg);font-size:14px;padding:8px 20px;text-align:center}.pro a{color:inherit}
.soc{margin-top:60px}.soc p{color:var(--mute);margin:-6px 0 18px}.soc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.sc{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink)}.sc:hover{border-color:var(--rose)}
.sc .ic{width:44px;height:44px;border-radius:12px;background:var(--rose2);color:var(--rose);display:grid;place-items:center;margin-bottom:10px;font-weight:700;font-size:22px}.sc .h{font-weight:600}.sc .s{color:var(--mute);font-size:14px}
a.lnk{display:inline-block}
</style></head>

["Mocassins cuir cognac","Mocassins",109,0,[38,39,40,41,42],"flat","#8a4b2a",8,2,0],
["Mocassins noirs brillants","Mocassins",105,139,[39,40,41,42],"flat","#1c1a1d",50,2,0]];
return R.map((r,n)=>({id:"d"+n,name:r[0],cat:r[1],price:r[2],old:r[3],sizes:r[4],desc:"Exemple de fiche : cuir souple, semelle confort, modèle présent en boutique.",imgs:Array.from({length:r[8]},(_,k)=>shoeSVG(r[5],r[6],BGS[(n+k*2)%5],k%2)),date:new Date(Date.now()-r[7]*864e5).toISOString(),sold:!!r[9]}))};

const sb=CONFIG.SUPABASE_URL.includes("VOTRE")?null:supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
const $=s=>document.querySelector(s);
let D={items:[]},S={cat:"Toutes",q:"",size:"",fav:false,admin:false,login:false,user:null,err:"",busy:false,loginErr:""};
let F=[];try{F=JSON.parse(localStorage.getItem('ce-fav')||'[]')}catch(e){}
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pics=i=>i.imgs||[];
const eur=n=>Number(n).toLocaleString('fr-FR')+" €";
const isNew=i=>(Date.now()-new Date(i.date))/864e5<=21;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}
const norm=r=>({id:r.id,name:r.name,cat:r.cat,price:Number(r.price),old:Number(r.old_price||0),sizes:r.sizes||[],desc:r.descr||"",imgs:r.photos||[],date:r.created_at,sold:!!r.sold});
async function load(){if(!sb){try{const s=localStorage.getItem('ce-demo2');D.items=s?JSON.parse(s):mkDemo()}catch(e){D.items=mkDemo()}return}
const {data,error}=await sb.from('shoes').select('*').order('created_at',{ascending:false});
if(error){S.err="La collection ne s'est pas chargée. Réessayez dans un instant ou appelez la boutique."}else{S.err="";D.items=data.map(norm)}}
function card(i){const f=F.includes(i.id),p=pics(i);

<div class="meta"><b>${esc(i.name)}</b><span>${esc(i.cat)}</span><div><span class="price">${eur(i.price)}</span>${i.old>i.price?`<span class="old">${eur(i.old)}</span>`:''}</div></div></button>
${i.sold?'<span class="tag s">Vendu</span>':i.old>i.price?'<span class="tag">Soldes</span>':isNew(i)?'<span class="tag">Nouveau</span>':''}
<button class="heart" data-fav="${i.id}" aria-pressed="${f}" aria-label="Ajouter aux favoris">${f?'♥':'♡'}</button></div>`}
const list=()=>D.items.filter(i=>(S.cat=="Toutes"||i.cat==S.cat)&&(!S.q||(i.name+i.desc+i.cat).toLowerCase().includes(S.q.toLowerCase()))&&(!S.size||i.sizes.includes(+S.size))&&(!S.fav||F.includes(i.id)));
function render(){location.hash==='#gerante'?adminPage():shopPage()}
function shopPage(){
const cats=["Toutes",...CATS.filter(c=>D.items.some(i=>i.cat==c))];
const sizes=[...new Set(D.items.flatMap(i=>i.sizes))].sort((a,b)=>a-b);

async function run(fn,ok){if(S.busy)return;S.busy=true;try{await fn();await load();render();toast(ok||"Enregistré")}catch(e){console.error(e);toast("Échec : "+(e.message||"réessayez"))}S.busy=false}
const byId=id=>D.items.find(x=>x.id==id);
const stPath=u=>decodeURIComponent(u.split('/shoes/').pop().split('?')[0]);
async function up(file){const blob=await shrink(file),path=(crypto.randomUUID?crypto.randomUUID():Date.now()+""+Math.random().toString(36).slice(2))+".jpg";
const r=await sb.storage.from('shoes').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});if(r.error)throw r.error;return sb.storage.from('shoes').getPublicUrl(path).data.publicUrl}
const chk=r=>{if(r.error)throw r.error;return r};
const toURL=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(b)});
const saveDemo=()=>{try{localStorage.setItem('ce-demo2',JSON.stringify(D.items))}catch(e){throw new Error("mémoire de l'aperçu pleine, supprimez des photos")}};
const API=sb?{
async add(r,files){const urls=[];for(const fl of files)urls.push(await up(fl));chk(await sb.from('shoes').insert({...r,photos:urls}))},
async del(i){if(pics(i).length)await sb.storage.from('shoes').remove(pics(i).map(stPath));chk(await sb.from('shoes').delete().eq('id',i.id))},
async sold(i){chk(await sb.from('shoes').update({sold:!i.sold}).eq('id',i.id))},
async addp(i,files){const u=[...pics(i)];for(const fl of files)if(u.length<8)u.push(await up(fl));chk(await sb.from('shoes').update({photos:u}).eq('id',i.id))},
async rmp(i,k){const gone=pics(i)[k];chk(await sb.from('shoes').update({photos:pics(i).filter((_,n)=>n!=k)}).eq('id',i.id));await sb.storage.from('shoes').remove([stPath(gone)])}
}:{
async add(r,files){const u=[];for(const fl of files)u.push(await toURL(await shrink(fl,700,.7)));D.items.unshift({id:"x"+Date.now(),name:r.name,cat:r.cat,price:r.price,old:r.old_price,sizes:r.sizes,desc:r.descr,imgs:u,date:new Date().toISOString(),sold:false});saveDemo()},
async del(i){D.items=D.items.filter(x=>x.id!=i.id);saveDemo()},
async sold(i){i.sold=!i.sold;saveDemo()},
async addp(i,files){for(const fl of files)if(pics(i).length<8)i.imgs.push(await toURL(await shrink(fl,700,.7)));saveDemo()},
async rmp(i,k){i.imgs=pics(i).filter((_,n)=>n!=k);saveDemo()}};
function bind(){
if($('#q'))$('#q').oninput=e=>{S.q=e.target.value;render();const q=$('#q');q.focus();q.setSelectionRange(99,99)};
if($('#sz'))$('#sz').onchange=e=>{S.size=e.target.value;render()};
if($('#favf'))$('#favf').onclick=()=>{S.fav=!S.fav;render()};
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});
document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=b.dataset.fav;F=F.includes(id)?F.filter(x=>x!=id):[...F,id];try{localStorage.setItem('ce-fav',JSON.stringify(F))}catch(e){}render()});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openFiche(b.dataset.open));
const ou=$('#out');if(ou)ou.onclick=async()=>{if(sb)await sb.auth.signOut();S.user=null;render()};
const rs=$('#reset');if(rs)rs.onclick=async()=>{try{localStorage.removeItem('ce-demo2')}catch(e){}await load();render();toast('Exemples remis')};
const lf=$('#login');if(lf)lf.onsubmit=async e=>{e.preventDefault();if(!sb){if($('#cd').value.trim().toLowerCase()===DEMO_CODE){S.user={id:'demo'};S.loginErr=''}else S.loginErr='Code incorrect.';render();return}const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
if(r.error){S.loginErr="E-mail ou mot de passe incorrect.";render()}else{S.loginErr=""}};
const f=$('#add');if(f){
f.onsubmit=e=>{e.preventDefault();$('#go').disabled=true;run(()=>API.add({name:$('#n').value.trim(),cat:$('#c').value,price:+$('#p').value,old_price:+$('#o').value||0,sizes:$('#s').value.split(/[,\s]+/).map(Number).filter(Boolean),descr:$('#d').value.trim()},[...$('#ph').files].slice(0,6)),"Paire publiée dans la vitrine")};
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm("Supprimer cette paire ?"))run(()=>API.del(byId(b.dataset.del)),"Paire supprimée")});
document.querySelectorAll('[data-sold]').forEach(b=>b.onclick=()=>run(()=>API.sold(byId(b.dataset.sold))));
document.querySelectorAll('[data-addp]').forEach(b=>b.onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;inp.onchange=()=>run(()=>API.addp(byId(b.dataset.addp),[...inp.files]),"Photos ajoutées");inp.click()});
document.querySelectorAll('[data-rmp]').forEach(b=>b.onclick=()=>{const[id,k]=b.dataset.rmp.split(':');if(confirm("Retirer cette photo ?"))run(()=>API.rmp(byId(id),+k),"Photo retirée")})}}
function shrink(file,m=1000,q=.8){return new Promise((ok,ko)=>{const r=new FileReader();r.onerror=ko;r.onload=()=>{const im=new Image();im.onerror=ko;im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):ko(new Error("photo illisible")),'image/jpeg',q)};im.src=r.result};r.readAsDataURL(file)})}
function openFiche(id){const i=byId(id);if(!i)return;const p=pics(i);let d=$('#dlg');if(!d){d=document.createElement('dialog');d.id='dlg';$('#ui').append(d)}
d.innerHTML=`<button class="x" aria-label="Fermer" onclick="this.closest('dialog').close()">×</button><div class="fiche"><div class="ph">${p[0]?`<img id="gi" src="${esc(p[0])}" alt="${esc(i.name)}">`:'👠'}${p.length>1?`<button class="gb l" id="gp" aria-label="Photo précédente">‹</button><button class="gb r" id="gn" aria-label="Photo suivante">›</button><div class="dots">${p.map((_,m)=>`<button class="dot" aria-label="Voir la photo ${m+1}"></button>`).join('')}</div>`:''}</div>
<div class="txt"><span style="color:var(--mute)">${esc(i.cat)}</span><h2>${esc(i.name)}</h2><p><span class="price" style="font-size:26px">${eur(i.price)}</span>${i.old>i.price?`<span class="old">${eur(i.old)}</span>`:''}</p>
<p>${esc(i.desc)}</p>${i.sizes.length?`<b>Pointures en boutique</b><div class="sizes">${i.sizes.map(s=>`<i>${s}</i>`).join('')}</div>`:''}
<p style="color:var(--mute);font-size:14px">${i.sold?'Cette paire est vendue.':'Disponible à la boutique. Appelez pour la mettre de côté.'}</p>
<div class="row" style="justify-content:flex-start"><a class="cta" href="tel:${SHOP.tel2}">Mettre de côté</a><button class="cta alt" id="sh">Partager</button></div></div></div>`;
d.showModal();gal(d,p);d.onclick=e=>{if(e.target===d)d.close()};
$('#sh').onclick=async()=>{const u={title:i.name+" · Chaussures Clara & Estelle",text:i.name+" à "+eur(i.price),url:location.href};try{if(navigator.share)await navigator.share(u);else{await navigator.clipboard.writeText(location.href);toast("Lien copié")}}catch(e){}}}
function gal(d,p){if(p.length<2)return;let k=0;const im=d.querySelector('#gi'),dots=d.querySelectorAll('.dot');
const go=n=>{k=(n+p.length)%p.length;im.src=p[k];dots.forEach((x,m)=>x.setAttribute('aria-current',m==k))};
d.querySelector('#gp').onclick=()=>go(k-1);d.querySelector('#gn').onclick=()=>go(k+1);dots.forEach((x,m)=>x.onclick=()=>go(m));
d.onkeydown=e=>{if(e.key=='ArrowLeft')go(k-1);if(e.key=='ArrowRight')go(k+1)};
let x0=0;im.ontouchstart=e=>{x0=e.touches[0].clientX};im.ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)go(k+(dx<0?1:-1))};go(0)}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
(async()=>{await load();render();
if(sb){const s=await sb.auth.getSession();S.user=s.data.session?.user||null;if(S.user)render();
sb.auth.onAuthStateChange((ev,ses)=>{const u=ses?.user||null;if((u&&u.id)!==(S.user&&S.user.id)){S.user=u;if(!u)S.admin=false;render()}})}})();
</script></body></html>
